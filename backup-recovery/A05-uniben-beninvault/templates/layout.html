<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>BeninVault</title><style>
body{margin:0;font-family:Tahoma,Arial;background:#f0f9ff;color:#0c4a6e}
.top{background:#0369a1;color:#fff;padding:10px 18px}.top a{color:#e0f2fe;margin-left:14px}
.c{max-width:1100px;margin:auto;padding:16px}.p{background:#fff;border:1px solid #bae6fd;border-radius:8px;padding:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px solid #e0f2fe;text-align:left}
.bad{color:#b91c1c;font-weight:bold}.good{color:#15803d;font-weight:bold}button{background:#0369a1;color:#fff;border:0;padding:6px 11px;border-radius:5px}
.sites{display:flex;gap:10px;flex-wrap:wrap}.site{flex:1 1 200px;border:2px solid #0369a1;border-radius:8px;padding:10px;background:#fff}
</style></head><body><div class="top"><b>BeninVault</b> &middot; {{ inst }}
{% if session.user %}<a href="/">Overview</a><a href="/backups">Backups</a><a href="/trail">Trail</a><a href="/logout">Sign out {{ session.user }}</a>{% endif %}</div>
<div class="c">{% with m = get_flashed_messages() %}{% for x in m %}<div class="p">{{ x }}</div>{% endfor %}{% endwith %}{% block main %}{% endblock %}</div></body></html>
